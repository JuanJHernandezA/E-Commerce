<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de la letra F y del borde -->
    <linearGradient id="tf-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Sombra/Resplandor Cyan -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Contenedor del Logo TF -->
  <g filter="url(#glow)">
    <!-- Tarjeta / Cuadro principal -->
    <rect width="120" height="120" rx="28" fill="#0F172A" stroke="url(#tf-gradient)" stroke-width="2.5" />
    
    <!-- Letra T -->
    <path d="M 32 40 H 82 M 50 40 V 88" stroke="#F8FAFC" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Letra F -->
    <path d="M 66 52 H 92 M 66 68 H 86 M 66 52 V 92" stroke="url(#tf-gradient)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
